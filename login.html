<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>damxd shop | Portal Auth</title>
    <!-- Import Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Modular Stylesheets -->
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>

<body>

    <div class="auth-container">
        <div class="logo">
            <i class="fa-solid fa-credit-card"></i> Damxd <span>Shop</span>
        </div>

        <div class="auth-tabs">
            <button class="tab-btn active" id="tabLoginBtn">Sign In</button>
            <button class="tab-btn" id="tabRegisterBtn">Register</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm">
            <div class="form-group">
                <label for="loginUser">Username</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="loginUser" class="form-input" placeholder="Enter username" required />
                </div>
            </div>
            <div class="form-group">
                <label for="loginPass">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="loginPass" class="form-input" placeholder="Enter password" required />
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="margin: 25px auto 0; justify-content: center; min-width: 200px;">ENTER CC WORLD</button>
            <a href="#" id="forgotPasswordLink" style="color: var(--text-muted); font-size: 12.5px; text-decoration: none; display: block; margin-top: 15px; font-weight: 500; transition: color 0.2s;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-muted)'">Forgot Password?</a>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" style="display: none;">
            <div class="form-group">
                <label for="regUser">Choose Username</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user-plus"></i>
                    <input type="text" id="regUser" class="form-input" placeholder="Enter username" required />
                </div>
            </div>
            <div class="form-group">
                <label for="regPass">Choose Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="regPass" class="form-input" placeholder="Create password" required />
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="margin: 25px auto 0; justify-content: center; min-width: 200px;">Create Account</button>
        </form>

        <!-- RECOVERY FORM -->
        <form id="recoverForm" style="display: none;">
            <div class="form-group">
                <label for="recoverUser">Username</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="recoverUser" class="form-input" placeholder="Enter username" required />
                </div>
            </div>
            <div class="form-group">
                <label for="recoverCode">Recovery Code</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-shield-halved"></i>
                    <input type="text" id="recoverCode" class="form-input" placeholder="DAMXD-XXXX" required />
                </div>
            </div>
            <div class="form-group">
                <label for="recoverNewPass">New Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="recoverNewPass" class="form-input" placeholder="Enter new password" required />
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="margin: 25px auto 0; justify-content: center; min-width: 200px;">Reset Password</button>
            <a href="#" id="backToLoginLink" style="color: var(--text-muted); font-size: 12.5px; text-decoration: none; display: block; margin-top: 15px; font-weight: 500; transition: color 0.2s;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-muted)'">Back to Login</a>
        </form>
    </div>

    <!-- RECOVERY CODES DISPLAY MODAL -->
    <div class="modal-overlay" id="recoveryCodesModal">
        <div class="modal-card modal-panel" style="max-width: 400px; text-align: center; margin: 15% auto;">
            <div class="modal-body modal-content-area">
                <i class="fa-solid fa-shield-halved" style="font-size: 48px; color: var(--primary); margin-bottom: 15px;"></i>
                <h2 style="font-family: var(--font-display); margin-bottom: 12px; color: #fff;">Save Recovery Codes</h2>
                <p style="color: var(--text-muted); font-size: 12.5px; margin-bottom: 15px; line-height: 1.5;">
                    These 10 recovery codes can be used to reset your password. **Each code can only be used once**. Save them securely!
                </p>
                <textarea id="recoveryCodesList" class="form-control-input" style="width: 100%; height: 160px; font-family: var(--font-mono); font-size: 12.5px; padding: 10px; background: var(--bg-base); color: var(--success); border: 1px solid var(--border-color); resize: none; margin-bottom: 15px;" readonly></textarea>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" id="copyRecoveryCodesBtn" style="flex: 1; justify-content: center;">Copy Codes</button>
                    <button class="btn btn-primary" id="closeRecoveryModalBtn" style="flex: 1; justify-content: center;">I've Saved Them</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Modular JS scripts -->
    <script src="assets/js/state.js"></script>
    <script src="assets/js/auth.js"></script>
</body>

</html>
